name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Install worktree audit prerequisite
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: npm install --no-save --ignore-scripts @earendil-works/pi-coding-agent@1.5.2
      - run: npm run check:compat
      - name: Check standalone statechart runtime selection
        run: node --test --test-name-pattern=launcher skills/statechart/scripts/test/cli.test.ts
